plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '5.3.0'
group = 'com.barbarajones'
base { archivesName = 'BarbaraJonesMod' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'
            mods { barbarajones { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'
            // Its own heap. build.ps1 exports JAVA_TOOL_OPTIONS=-Xmx768m to cap
            // the reobfuscation child process, and every JVM started afterwards
            // reads that too - including this one, where 768m is not enough to
            // generate a world and the server dies partway through startup with
            // an error that says nothing about heap size. An explicit -Xmx here
            // is applied after it and wins.
            jvmArgs '-Xmx1536M'
            mods { barbarajones { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [ mod_version: project.version ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([ 'Specification-Title'   : 'barbarajones',
                     'Specification-Vendor'  : 'barbarajones',
                     'Specification-Version' : '1',
                     'Implementation-Title'  : project.name,
                     'Implementation-Version': project.jar.archiveVersion,
                     'Implementation-Vendor' : 'barbarajones' ])
    }
    finalizedBy 'reobfJar'
}

// Source is UTF-8. Without this javac uses the platform default, which on this
// machine is windows-1252 - that is why the quest book's tick mark shipped as
// "âœ”" in chat, and why a '★' char literal failed to compile at all: a 3-byte
// UTF-8 sequence read as three cp1252 characters is not a character literal.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
